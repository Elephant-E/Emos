name = "emos"
main = "worker-with-assets.js"
compatibility_date = "2024-01-01"

# 构建配置
[build]
command = "npm run build && node build-worker.cjs"

# 环境变量
# 敏感密钥（TMDB_API_KEY / SPOTIFY_ANON_KEY）不入库，部署时用 wrangler secret 注入：
#   wrangler secret put TMDB_API_KEY
#   wrangler secret put SPOTIFY_ANON_KEY
# 非敏感配置保留在 [vars]
[vars]
EMOS_PROXY_NAME = "@Elephant"
EMOS_PROXY_ID = "e7E6K6OE4s"

# 可观测性配置
[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

# 路由配置（可选，如果需要自定义域名）
# [env.production]
# routes = ["emos.best/*"]
